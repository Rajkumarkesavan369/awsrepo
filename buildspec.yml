version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install -g @angular/cli@17
  pre_build:
    commands:
      - npm install
  build:
    commands:
      - ng build -c production
    finally:
      - echo This is the final block execution!
artifacts:
  files:
    - 'deploy-scripts/**/*'
    - 'dist/my-angular-project/**/*'
    - appspec.yml